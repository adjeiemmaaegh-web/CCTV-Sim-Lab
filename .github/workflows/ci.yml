name: CI
on:
  push:
    branches: [main, 'stage*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SecurityLab/frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SecurityLab/frontend-react/package-lock.json
      - run: npm ci
      - name: Check production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Record development dependency advisories
        run: |
          npm audit --json > "${RUNNER_TEMP}/securitylab-audit.json" || true
          node -e 'const a=require(process.env.RUNNER_TEMP+"/securitylab-audit.json"); for(const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name+" | "+v.severity+" | direct="+v.isDirect+" | fix="+JSON.stringify(v.fixAvailable));'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: SecurityLab/frontend-react/test-results
